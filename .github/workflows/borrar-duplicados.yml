name: Borrar duplicados
on:
  workflow_dispatch:
    inputs:
      max: {description: "Cuantas borrar en esta corrida", default: "5"}
permissions:
  contents: write
concurrency: publicar
jobs:
  borrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Borrar despacio
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MAX: ${{ github.event.inputs.max }}
        run: python borrar.py
      - name: Guardar progreso
        if: always()
        run: |
          git config user.name "palma-robot"
          git config user.email "palma-robot@users.noreply.github.com"
          git add data/ && git commit -m "Borrado de duplicados $(date -u +%F_%H:%M)" && git push || echo "Sin cambios"
