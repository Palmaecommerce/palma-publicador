name: Publicar
on:
  schedule:
    - cron: "7 * * * *"   # cada hora, al minuto 7
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [calendario.json]
permissions:
  contents: write
concurrency: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar lo que ya tiene la hora cumplida
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python publicador.py publicar
      - name: Guardar lo publicado
        if: always()
        run: |
          git config user.name "palma-robot"
          git config user.email "palma-robot@users.noreply.github.com"
          git add data/ && git commit -m "Publicado $(date -u +%F_%H:%M)" && git push || echo "Sin cambios"
