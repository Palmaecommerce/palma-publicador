name: Estadisticas
on:
  schedule:
    - cron: "17 9 * * *"   # todos los días 6:17 de Argentina
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: publicar
jobs:
  estadisticas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar métricas de Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python publicador.py estadisticas
      - name: Guardar
        run: |
          git config user.name "palma-robot"
          git config user.email "palma-robot@users.noreply.github.com"
          git add data/ && git commit -m "Estadísticas $(date -u +%F)" && git push || echo "Sin cambios"
