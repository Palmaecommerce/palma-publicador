name: Renovar token
on:
  schedule:
    - cron: "23 12 1,20 * *"   # días 1 y 20 de cada mes
  workflow_dispatch: {}
jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: nuevo
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python publicador.py renovar
      - name: Guardar el token nuevo en el secreto IG_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set IG_TOKEN --body "${{ steps.nuevo.outputs.token }}" --repo "$GITHUB_REPOSITORY"
